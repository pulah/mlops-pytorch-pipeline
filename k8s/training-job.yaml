apiVersion: batch/v1
kind: Job
metadata:
  name: mlops-training
  namespace: ml-training
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: trainer
          image: mlops-train:v1
          imagePullPolicy: IfNotPresent
          env:
            - name: CONFIG_PATH
              value: /app/configs/training_config.yaml
          resources:
            requests:
              cpu: "2"
              memory: "4Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "2"
              memory: "4Gi"
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: storage-volume
              mountPath: /app/data
              subPath: data
            - name: storage-volume
              mountPath: /app/checkpoints
              subPath: checkpoints
            - name: config-volume
              mountPath: /app/configs
      nodeSelector:
        accelerator: nvidia-gpu
      tolerations:
        - key: "gpu"
          operator: "Exists"
          effect: "NoSchedule"
      volumes:
        - name: storage-volume
          persistentVolumeClaim:
            claimName: checkpoints-pvc
        - name: config-volume
          configMap:
            name: training-config
